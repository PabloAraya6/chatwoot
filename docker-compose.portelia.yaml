# El taller: Rails, Sidekiq y Vite de desarrollo con este repo montado, sobre el Postgres y el
# Redis del laboratorio (LABORATORIO=~/Projects/chatwoot). Lo levanta bin/portelia-dev.
# Los servicios no se llaman rails, sidekiq ni vite porque comparten la red del laboratorio
# y GOWA le pega a `rails:3000`.
services:
  rails-taller: &taller
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BUNDLE_WITHOUT: ''
        EXECJS_RUNTIME: Node
        RAILS_ENV: development
        RAILS_SERVE_STATIC_FILES: 'false'
    image: chatwoot-portelia:taller
    env_file: ${LABORATORIO}/.env
    environment: &entorno
      RAILS_ENV: development
      NODE_ENV: development
      POSTGRES_DATABASE: chatwoot_production
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      FRONTEND_URL: http://localhost:3020
      VITE_RUBY_HOST: vite-taller
    volumes:
      - ./:/app:delegated
      - node_modules:/app/node_modules
      - cache:/app/tmp/cache
    networks: [laboratorio]
    ports:
      - '127.0.0.1:3020:3000'
    depends_on: [vite-taller]
    entrypoint: docker/entrypoints/rails.sh
    command: [bundle, exec, rails, s, -p, '3000', -b, 0.0.0.0]

  sidekiq-taller:
    <<: *taller
    ports: []
    depends_on: []
    entrypoint: []
    command: [bundle, exec, sidekiq, -C, config/sidekiq.yml]

  vite-taller:
    <<: *taller
    environment:
      <<: *entorno
      VITE_RUBY_HOST: 0.0.0.0
    ports:
      - '127.0.0.1:3036:3036'
    depends_on: []
    entrypoint: []
    command: [sh, -c, 'pnpm install --frozen-lockfile --prefer-offline && bin/vite dev']

networks:
  laboratorio:
    external: true
    name: chatwoot_default

volumes:
  node_modules:
  cache:
